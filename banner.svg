<svg width="850" height="360" viewBox="0 0 850 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="mesh1" cx="10%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#1F6FEB" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1F6FEB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mesh2" cx="90%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#00D0FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00D0FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mesh3" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#8A2BE2" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8A2BE2" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#8cb5ff"/>
      <stop offset="100%" stop-color="#00d0ff"/>
    </linearGradient>

    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="blurBig" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <filter id="blurSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>

    <clipPath id="roundedFrame">
      <rect x="0" y="0" width="850" height="360" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundedFrame)">
    <rect width="850" height="360" fill="#0d1117"/>

    <circle cx="85" cy="72" r="220" fill="url(#mesh1)" filter="url(#blurBig)"/>
    <circle cx="765" cy="288" r="260" fill="url(#mesh2)" filter="url(#blurBig)"/>
    <circle cx="425" cy="180" r="240" fill="url(#mesh3)" filter="url(#blurBig)"/>

    <circle cx="40" cy="20" r="90" fill="#1F6FEB" opacity="0.35" filter="url(#blurBig)">
      <animate attributeName="cy" values="20;40;20" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="840" cy="120" r="110" fill="#8A2BE2" opacity="0.28" filter="url(#blurBig)">
      <animate attributeName="cy" values="120;95;120" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="400" r="100" fill="#00D0FF" opacity="0.25" filter="url(#blurBig)">
      <animate attributeName="cx" values="200;230;200" dur="9s" repeatCount="indefinite"/>
    </circle>

    <circle cx="130" cy="70" r="4" fill="#93c5fd" filter="url(#blurSoft)">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="70" cy="215" r="5" fill="#c084fc" filter="url(#blurSoft)">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="635" cy="105" r="3.5" fill="#67e8f9" filter="url(#blurSoft)">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="745" cy="255" r="4.5" fill="#60a5fa" filter="url(#blurSoft)">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="3.8s" repeatCount="indefinite"/>
    </circle>

    <rect x="18" y="18" width="814" height="324" rx="26" fill="url(#glassGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

    <circle cx="790" cy="95" r="55" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" opacity="0.6"/>
    <circle cx="815" cy="270" r="26" fill="none" stroke="#00D0FF" stroke-width="2" opacity="0.4"/>

    <rect x="56" y="52" width="188" height="30" rx="15" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
    <circle cx="74" cy="67" r="4" fill="#4ade80">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="88" y="72" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.2" fill="#d1d5db">OPEN TO COLLABORATE</text>

    <text x="56" y="145" font-family="'Space Grotesk', Arial, sans-serif" font-size="56" font-weight="700" fill="url(#textGrad)">Abhay Chauhan</text>

    <text x="58" y="180" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#d1d5db">
      AI Developer <tspan fill="#00D0FF">•</tspan> Full Stack Developer <tspan fill="#00D0FF">•</tspan> Problem Solver
    </text>

    <g font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#e5e7eb">
      <rect x="58" y="205" width="98" height="38" rx="12" fill="url(#pillGrad)" stroke="rgba(255,255,255,0.18)"/>
      <text x="102" y="229" text-anchor="middle">Python</text>

      <rect x="168" y="205" width="176" height="38" rx="12" fill="url(#pillGrad)" stroke="rgba(255,255,255,0.18)"/>
      <text x="256" y="229" text-anchor="middle">JAVA</text>

      <rect x="356" y="205" width="164" height="38" rx="12" fill="url(#pillGrad)" stroke="rgba(255,255,255,0.18)"/>
      <text x="438" y="229" text-anchor="middle">React / Fullstack</text>

      <rect x="532" y="205" width="164" height="38" rx="12" fill="url(#pillGrad)" stroke="rgba(255,255,255,0.18)"/>
      <text x="614" y="229" text-anchor="middle">APIs &amp; React</text>

      <rect x="708" y="205" width="130" height="38" rx="12" fill="url(#pillGrad)" stroke="rgba(255,255,255,0.18)"/>
      <text x="773" y="229" text-anchor="middle">Cloud Tech</text>
    </g>

    <rect x="58" y="268" width="600" height="42" rx="8" fill="rgba(0,0,0,0.35)" stroke="rgba(255,255,255,0.06)"/>
    <text x="74" y="294" font-family="'Courier New', monospace" font-size="14">
      <tspan fill="#f472b6">const</tspan>
      <tspan fill="#93c5fd"> developer</tspan>
      <tspan fill="#e5e7eb"> = { </tspan>
      <tspan fill="#86efac">status</tspan>
      <tspan fill="#e5e7eb">: </tspan>
      <tspan fill="#fde047">"building the future"</tspan>
      <tspan fill="#e5e7eb"> };</tspan>
    </text>
  </g>

  <rect x="0.75" y="0.75" width="848.5" height="358.5" rx="27" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
</svg>
